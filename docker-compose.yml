services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-boeba}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-boeba_secret_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-boeba}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-boeba} -d ${POSTGRES_DB:-boeba}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3001
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-boeba}:${POSTGRES_PASSWORD:-boeba_secret_change_me}@postgres:5432/${POSTGRES_DB:-boeba}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY}
      WPPCONNECT_API_URL: ${WPPCONNECT_API_URL}
      WPPCONNECT_SESSION_NAME: ${WPPCONNECT_SESSION_NAME}
      WPPCONNECT_SECRET_KEY: ${WPPCONNECT_SECRET_KEY}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@boeba.id}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-BoebaAdmin123!}
    volumes:
      - ./backups:/data/backups:ro

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

volumes:
  pg_data:
  caddy_data:
  caddy_config:
